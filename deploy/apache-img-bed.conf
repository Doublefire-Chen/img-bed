# Apache virtual host for img-bed on img.aka.cy, the alternative to
# nginx-img-bed.conf. Install as /etc/apache2/sites-available/img.aka.cy.conf
# and enable with `a2ensite img.aka.cy`. Needs mod_ssl, mod_proxy,
# mod_proxy_http, mod_headers and mod_rewrite (`a2enmod ...`).
# Apache terminates TLS and proxies every request, including /admin/ and
# /api/, to the binary on localhost. See deploy/README.md.

<VirtualHost *:80>
    ServerName img.aka.cy

    # Keep whatever ACME challenge handling your existing cert setup uses here.
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName img.aka.cy

    # TLS: point these at the certificate the old Lsky Pro site used.
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/img.aka.cy/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/img.aka.cy/privkey.pem

    # upload_limit_mb (20) + 1 MiB of multipart overhead, in bytes. Raise both
    # together.
    LimitRequestBody 22020096

    # img-bed sets its own security headers on every response (ADR 0001);
    # don't add or override them here.

    # `nocanon` passes the request path through untouched, so percent-encoded
    # Paths (non-ASCII names) reach img-bed exactly as the Visitor sent them.
    ProxyPreserveHost On
    ProxyTimeout 120
    ProxyPass        / http://127.0.0.1:8080/ nocanon
    ProxyPassReverse / http://127.0.0.1:8080/
    RequestHeader set X-Forwarded-Proto https
</VirtualHost>
