# nginx server block for img-bed on img.aka.cy. Install as e.g.
# /etc/nginx/sites-available/img.aka.cy (or conf.d/img.aka.cy.conf).
# nginx terminates TLS and proxies every request, including /admin/ and
# /api/, to the binary on localhost. See deploy/README.md.

upstream img_bed {
    server 127.0.0.1:8080;   # = listen in /etc/img-bed/img-bed.toml
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name img.aka.cy;

    # Keep whatever ACME challenge location your existing cert setup uses here.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # On nginx >= 1.25.1 you may write `listen 443 ssl;` plus `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name img.aka.cy;

    # TLS: point these at the certificate the old Lsky Pro site used (e.g.
    # certbot's), or include your existing snippet instead.
    ssl_certificate     /etc/letsencrypt/live/img.aka.cy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/img.aka.cy/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # upload_limit_mb (20) + 1M of multipart overhead. Raise both together.
    client_max_body_size 21M;

    # img-bed sets its own security headers on every response (ADR 0001);
    # don't add or override them here.

    location / {
        proxy_pass http://img_bed;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads: buffer the request body in nginx so a slow client doesn't
        # hold a connection to the binary, and allow slow links some time.
        proxy_request_buffering on;
        client_body_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
